repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '^(charts/.*/templates/|talos/rendered/)'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks: [{ id: yamllint, args: ['-c', '.yamllint.yaml'] }]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks: [{ id: shellcheck, args: ['-x'] }]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: inventory-schema
        name: Validate inventory against JSON Schema
        entry: bash tools/validate-inventory.sh
        language: system
        pass_filenames: false
        files: '^inventory/'
      - id: no-latest-tags
        name: Reject :latest image tags
        entry: bash tools/check-no-latest-tag.sh
        language: system
        pass_filenames: false
