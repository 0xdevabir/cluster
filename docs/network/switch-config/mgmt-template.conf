# NEXUS management-switch configuration template (Phase 03 Task 7)
# r01-mgmt: 48-port 1GbE. Carries VLAN 100 only — the out-of-band plane that
# controls power (PDUs) and provisioning (PXE). Deliberately never carries
# VLAN 200/300/301/400 traffic (ARCHITECTURE.md#0.2). NOT applied to hardware
# in this phase — Phase 07 stages management-network bring-up.
# Variables: {{MGMT_IP}} {{MGMT_GATEWAY}}

# 1. Hostname, mgmt IP (this switch IS the mgmt plane — no separate mgmt VRF split needed)
hostname r01-mgmt
interface vlan100
  ip address {{MGMT_IP}}/22

# 2. NTP + syslog + SNMP/gNMI
ntp server 10.100.0.10
logging host 10.100.0.10
snmp-server enable

# 3. Interface config — 1500 MTU everywhere (N6: PXE ROM compatibility)
interface eth1-48
  mtu 1500
  no shutdown

# 4. VLAN definitions — access port, VLAN 100 only, on every host/infra port
vlan 100
  vlan-id 100
  mtu 1500
interface eth1-48
  switchport access vlan 100

# 5. MLAG — not applicable; single mgmt switch, not a redundant pair at M1
#    (Task 8 failure analysis: mgmt switch loss stops PXE/power-cycle but
#    does not affect the running cluster — accepted single point of failure)

# 6. QoS — not applicable; management traffic is not RoCE, no lossless requirement

# 7. BGP — not applicable; management network is a flat access VLAN, no routing tier

# 8. Storm control — applied here, not on the leaves, since this is where
#    every host's low-speed mgmt NIC (and PXE broadcast traffic) actually lands
interface eth1-48
  storm-control broadcast level 10
  storm-control multicast level 20

# 9. AAA — TACACS/RADIUS or local + SSH keys; disable telnet
#    CRITICAL on this switch specifically: it fronts PDU control (power-cycle
#    capability) — see docs/facility/power-control-design.md.
no service telnet
ssh server
username admin nopassword
aaa authentication login default group tacacs+ local

# 10. Save + config-backup hook
#   scp <config> 10.100.0.10:/srv/net-config-backup/r01-mgmt-$(date +%F).conf

# NOT routable from tenant workloads (DO NOT list) — this VLAN must never be
# reachable from a Kubernetes pod. Enforced at the leaf (VLAN 100 is not
# trunked to any host-facing leaf port) and again at Phase 16 (NetworkPolicy
# default-deny).
