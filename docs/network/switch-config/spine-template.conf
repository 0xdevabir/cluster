# NEXUS spine switch configuration template (Phase 03 Task 7)
# NOT applied to hardware — no spine exists at M1 (only 1 rack). Written now,
# per the phase's own "design the BGP scheme even though you do not need it
# yet" warning, so it activates unchanged at M3 when the first spine is racked.
# Variables: {{SWITCH_NAME}} {{MGMT_IP}} {{MGMT_GATEWAY}} {{SPINE_ASN}} {{LEAF_ASNS}}

# 1. Hostname, mgmt VRF, mgmt IP
hostname {{SWITCH_NAME}}
vrf mgmt
interface eth0
  vrf mgmt
  ip address {{MGMT_IP}}/22
  ip route vrf mgmt 0.0.0.0/0 {{MGMT_GATEWAY}}

# 2. NTP + syslog + SNMP/gNMI
ntp server 10.100.0.10 vrf mgmt
logging host 10.100.0.10 vrf mgmt
snmp-server vrf mgmt
gnmi-server enable vrf mgmt

# 3. Interface config — MTU 9216 on all leaf-facing ports
interface swp1-32
  mtu 9216
  no shutdown

# 4. VLAN definitions — spines are L3-only (routed), no host-facing VLANs
#    See docs/network/bgp-design.md — L3-to-the-host, no large L2 domain.

# 5. MLAG — not applicable to spines (leaf-only construct in this design)

# 6. QoS — spines carry the same lossless contract as leaves (traffic transits
#    them); apply docs/network/roce-contract.md identically.
qos trust dscp
qos map dscp 26 to traffic-class 3
priority-flow-control priority 3 enable
priority-flow-control priority 6 enable
priority-flow-control watchdog
random-detect ecn minimum-threshold 150 kbytes maximum-threshold 1500 kbytes probability 100 traffic-class 3
no flowcontrol receive
no flowcontrol send

# 7. BGP — one session per leaf, unnumbered, ECMP, BFD
router bgp {{SPINE_ASN}}
  bgp router-id {{MGMT_IP}}
  neighbor LEAVES peer-group
  neighbor LEAVES remote-as external   # each leaf brings its own ASN (65101, 65102, ...)
  neighbor LEAVES bfd
  bgp bestpath as-path multipath-relax
  maximum-paths 8
  graceful-restart

bfd profile fast
  interval 300 min-rx 300 multiplier 3

# 8. Storm control — n/a, no host-facing ports on a spine

# 9. AAA — TACACS/RADIUS or local + SSH keys; disable telnet
no service telnet
ssh server vrf mgmt
username admin nopassword
aaa authentication login default group tacacs+ local

# 10. Save + config-backup hook
#   scp <config> 10.100.0.10:/srv/net-config-backup/{{SWITCH_NAME}}-$(date +%F).conf
