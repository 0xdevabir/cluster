# NEXUS leaf switch configuration template (Phase 03 Task 7)
# Vendor syntax: Cumulus Linux / SONiC style — adapt to the actual NOS at
# purchase time (Phase 05). NOT applied to hardware in this phase — Phase 21
# applies the RoCE QoS sections after real NICs exist to test against.
# Variables: {{SWITCH_NAME}} {{MGMT_IP}} {{MGMT_GATEWAY}} {{ASN}} {{PEER_ASN_HOST}}
# {{PEER_ASN_SPINE}} {{MLAG_PEER_IP}} {{RACK}}

# 1. Hostname, mgmt VRF, mgmt IP
hostname {{SWITCH_NAME}}
vrf mgmt
interface eth0
  vrf mgmt
  ip address {{MGMT_IP}}/22
  ip route vrf mgmt 0.0.0.0/0 {{MGMT_GATEWAY}}

# 2. NTP + syslog + SNMP/gNMI
ntp server 10.100.0.10 vrf mgmt         # seed-node, Phase 07
logging host 10.100.0.10 vrf mgmt
snmp-server vrf mgmt
gnmi-server enable vrf mgmt             # for Phase 45 telemetry

# 3. Interface config — MTU 9216 on all fabric ports (9000 payload + overhead)
interface swp1-28
  mtu 9216
  no shutdown

# 4. VLAN definitions and per-port tagging
#    100=management(1500) 200=cluster(9000) 300=storage(9000)
#    301=storage-cluster(9000) 400=rdma(9000, lossless)
vlan 100
  vlan-id 100
  mtu 1500
vlan 200
  vlan-id 200
  mtu 9000
vlan 300
  vlan-id 300
  mtu 9000
vlan 301
  vlan-id 301
  mtu 9000
vlan 400
  vlan-id 400
  mtu 9000
# host ports: trunk 200,300,301,400 per node role (see inventory/network/switch-ports.yaml)
interface swp1-28
  bridge vlan add vlan 200,300,301,400

# 5. MLAG peering with the rack's other leaf
interface swp31-32
  mtu 9216
  no shutdown
clag
  clag-id 1
  peer-ip {{MLAG_PEER_IP}}
  backup-ip 10.100.1.0/22 vrf mgmt      # over the management network, not the peer-link
  peer-link swp31-32

# 6. QoS: DSCP trust, PFC priority 3, ECN/WRED, buffer profile
#    Full contract: docs/network/roce-contract.md — apply exactly, both ends.
qos trust dscp
qos map dscp 26 to traffic-class 3
priority-flow-control priority 3 enable
priority-flow-control watchdog
random-detect ecn minimum-threshold 150 kbytes maximum-threshold 1500 kbytes probability 100 traffic-class 3
no flowcontrol receive
no flowcontrol send
# CNP (DSCP 48 -> priority 6) must also be lossless or congestion notifications get dropped:
priority-flow-control priority 6 enable

# 7. BGP: ASN, unnumbered peers, ECMP, BFD, prefix-lists
#    Inactive at M1 (no spine, single rack) — configured now per
#    docs/network/bgp-design.md so it activates unchanged at M3.
router bgp {{ASN}}
  bgp router-id {{MGMT_IP}}
  neighbor HOSTS peer-group
  neighbor HOSTS remote-as {{PEER_ASN_HOST}}
  neighbor HOSTS bfd
  neighbor SPINES peer-group
  neighbor SPINES remote-as {{PEER_ASN_SPINE}}
  neighbor SPINES bfd
  bgp bestpath as-path multipath-relax
  maximum-paths 8
  graceful-restart
  address-family ipv4 unicast
    neighbor HOSTS prefix-list HOST-IN in
    neighbor HOSTS route-map ADVERTISE-DEFAULT out

ip prefix-list HOST-IN seq 5  permit 10.244.0.0/14 ge 24 le 24
ip prefix-list HOST-IN seq 10 permit 10.10.0.0/24 ge 32 le 32
ip prefix-list HOST-IN seq 99 deny 0.0.0.0/0 le 32

bfd profile fast
  interval 300 min-rx 300 multiplier 3

# 8. Storm control — management VLAN only
interface swp1-28
  # applied only where role=management trunk is present (mgmt switch handles most of this — see mgmt-template.conf)
  storm-control broadcast level 10 vlan 100

# 9. AAA — TACACS/RADIUS or local + SSH keys; disable telnet
no service telnet
ssh server vrf mgmt
username admin nopassword
aaa authentication login default group tacacs+ local   # or local-only until TACACS is deployed (Phase 04)

# 10. Save + config-backup hook
# `nv config save` (Cumulus) or `write memory` (SONiC), then:
#   scp <config> 10.100.0.10:/srv/net-config-backup/{{SWITCH_NAME}}-$(date +%F).conf
